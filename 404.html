<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Page not found — ADYAN</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/png" href="/ds/assets/logo-monogram.png"/>
<!-- Self-contained on purpose: must render even if the main CSS/JS fails. -->
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0D1D29; color: #F5F7FA;
    font-family: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
    text-align: center; padding: 24px;
  }
  .wrap { max-width: 480px; }
  img { width: 56px; height: 56px; margin-bottom: 24px; }
  .code {
    font-size: 13px; letter-spacing: .18em; color: rgba(245,247,250,.5);
    text-transform: uppercase; margin-bottom: 10px;
  }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 12px; }
  p { font-size: 15.5px; line-height: 1.6; color: rgba(245,247,250,.72); margin: 0 0 28px; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block; padding: 12px 22px; border-radius: 999px;
    font-size: 14.5px; font-weight: 600; text-decoration: none;
  }
  a.primary { background: #1A75DE; color: #fff; }
  a.primary:hover { background: #2C8BF0; }
  a.secondary { border: 1px solid rgba(58,87,120,.5); color: #F5F7FA; }
  a.secondary:hover { border-color: #1A75DE; }
</style>
</head>
<body>
<div class="wrap">
  <img src="/ds/assets/logo-monogram.png" alt="ADYAN"/>
  <div class="code">404 — Not found</div>
  <h1>This page doesn't exist.</h1>
  <p>The link may be old or mistyped. Everything ADYAN builds, services, and production systems is one click away.</p>
  <div class="actions">
    <a class="btn primary" href="/">Go to the homepage</a>
    <a class="btn secondary" href="/contact">Book a Systems Audit</a>
  </div>
</div>
</body>
</html>
