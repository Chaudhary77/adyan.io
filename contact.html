  /* Contact form: validation + submission states (scoped to this page) */
  .form-row .err-msg { font-family: var(--font-body); font-size: 11.5px; color: #ff6b6b; margin-top: 2px; }

  .booking-success {
    grid-column: 1 / -1; background: var(--bg-elev-1); border: 1px solid var(--border-1);
